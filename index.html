<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Brawl Stars</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>Brawl Stars</h2>

    <nav>
        <ul class="menu-list">
            <li><a href="#brawlers">Бравлери</a></li>
            <li><a href="#players">Гравці</a></li>
            <li><a href="#maps">Карти</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="hero">
        <div>
            <h1>Збирай кубки!</h1>

            <p>
                Brawl Stars — популярна гра від Supercell.
                Грай за різних бравлерів та перемагай!
            </p>

            <button>Грати</button>
        </div>

        <img src="brawl.jpg" alt="Brawl Stars">
    </section>

    <section id="brawlers">
        <h2>Бравлери</h2>

        <div class="cards">

            <div class="card">
                <img src="shelly.jpg">
                <h3>Шеллі</h3>
            </div>

            <div class="card">
                <img src="leon.jpg">
                <h3>Леон</h3>
            </div>

            <div class="card">
                <img src="spike.jpg">
                <h3>Спайк</h3>
            </div>

        </div>
    </section>

    <section id="players">
        <h2>Гравці</h2>

        <ul>
            <li>Elox</li>
            <li>prostislav</li>
            <li>vital shark</li>
        </ul>
    </section>

</main>

<footer id="maps">
    <h2>Карти</h2>
    <p>Showdown, Gem Grab, Brawl Ball</p>
</footer>

</body>
</html>
